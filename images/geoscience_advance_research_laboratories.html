<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geoscience Advance Research Laboratories (GARL)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   DESIGN TOKENS: ALABASTER STONE (LIGHT) & DEEP BASALT (DARK)
   ========================================================================== */
:root {
  --bg: #F6F5F0;
  --bg-mesh-1: rgba(13, 122, 133, 0.08);
  --bg-mesh-2: rgba(212, 122, 57, 0.08);
  --paper: rgba(255, 255, 255, 0.82);
  --paper-solid: #FFFFFF;
  --paper-subtle: rgba(246, 245, 240, 0.75);
  --ink: #0B1D26;
  --ink-2: #3A525E;
  --ink-3: #6C8490;
  --line: rgba(11, 29, 38, 0.1);
  --line-strong: rgba(11, 29, 38, 0.18);
  --glass-border: rgba(255, 255, 255, 0.7);
  --teal: #0D7A85;
  --teal-l: #139AA8;
  --teal-d: #08555D;
  --tint: rgba(13, 122, 133, 0.09);
  --copper: #D47A39;
  --copper-l: #E89554;
  --gold: #E5A93C;
  --copper-tint: rgba(212, 122, 57, 0.12);
  --ok: #199A62;
  --shadow-sm: 0 4px 14px -4px rgba(11, 29, 38, 0.07), 0 1px 3px rgba(11, 29, 38, 0.04);
  --shadow-md: 0 14px 34px -10px rgba(11, 29, 38, 0.12), 0 4px 12px -2px rgba(11, 29, 38, 0.05);
  --shadow-lg: 0 28px 68px -16px rgba(11, 29, 38, 0.22), 0 0 0 1px rgba(11, 29, 38, 0.08);
  --cell-off: #EAECE8;
  --cell-off-txt: #8FA1AA;
  --topo-stroke: rgba(11, 29, 38, 0.035);

  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

html[data-theme="dark"] {
  --bg: #081217;
  --bg-mesh-1: rgba(19, 154, 168, 0.14);
  --bg-mesh-2: rgba(212, 122, 57, 0.11);
  --paper: rgba(15, 31, 40, 0.78);
  --paper-solid: #10212B;
  --paper-subtle: rgba(20, 40, 52, 0.65);
  --ink: #F2F5F7;
  --ink-2: #A7BEC8;
  --ink-3: #6B8592;
  --line: rgba(255, 255, 255, 0.09);
  --line-strong: rgba(255, 255, 255, 0.18);
  --glass-border: rgba(255, 255, 255, 0.08);
  --teal: #17A2B0;
  --teal-l: #33C3D1;
  --teal-d: #0D7A85;
  --tint: rgba(23, 162, 176, 0.14);
  --copper: #E08543;
  --copper-l: #F2A063;
  --gold: #F0B849;
  --copper-tint: rgba(224, 133, 67, 0.15);
  --ok: #28C780;
  --shadow-sm: 0 4px 14px -4px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 14px 34px -10px rgba(0, 0, 0, 0.55);
  --shadow-lg: 0 30px 70px -16px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.1);
  --cell-off: rgba(255, 255, 255, 0.05);
  --cell-off-txt: #526B77;
  --topo-stroke: rgba(255, 255, 255, 0.03);
}

html[lang="ur"] {
  --display: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Segoe UI', serif;
  --body: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Segoe UI', serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  overflow: hidden;
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color 0.4s ease, color 0.4s ease;
}

/* Ambient Geological Contour & Radial Mesh Backdrop */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 12% 15%, var(--bg-mesh-1) 0%, transparent 45%),
    radial-gradient(circle at 88% 82%, var(--bg-mesh-2) 0%, transparent 48%),
    radial-gradient(circle at 52% 45%, rgba(229, 169, 60, 0.04) 0%, transparent 60%);
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.65;
  background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 30 Q 30 15, 60 30 T 120 30 M0 60 Q 30 45, 60 60 T 120 60 M0 90 Q 30 75, 60 90 T 120 90' fill='none' stroke='rgba(128,140,145,0.07)' stroke-width='1'/%3E%3C/svg%3E");
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--copper);
  outline-offset: 3px;
  border-radius: 10px;
}

html[lang="ur"] * {
  letter-spacing: 0 !important;
}

/* Custom Sleek Scrollbar */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(122, 146, 156, 0.3);
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--teal);
}

/* ==========================================================================
   SHARED HEADER & CONTROLS
   ========================================================================== */
.brand {
  display: flex;
  align-items: center;
  gap: 13px;
}

.brand-mark {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, #0F2A36 0%, #08171E 100%);
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 8px 20px -6px rgba(11, 29, 38, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.2);
  display: grid;
  place-items: center;
  flex: none;
  position: relative;
  overflow: hidden;
}

.brand-mark::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top right, rgba(212, 122, 57, 0.35), transparent 65%);
}

.brand-mark svg {
  width: 22px;
  height: 22px;
  position: relative;
  z-index: 1;
}

.brand b {
  font-family: var(--display);
  font-weight: 800;
  font-size: 1.12rem;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand b::after {
  content: "GSP";
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 5px;
  background: var(--tint);
  color: var(--teal);
  border: 1px solid var(--line);
}

.brand span {
  display: block;
  font-size: 0.74rem;
  color: var(--ink-3);
  font-weight: 500;
  margin-top: 1px;
}

.top-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--paper);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: grid;
  place-items: center;
  color: var(--ink-2);
  box-shadow: var(--shadow-sm);
  transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.icon-btn:hover {
  border-color: var(--teal);
  color: var(--teal);
  transform: translateY(-1px);
}

.icon-btn svg {
  width: 17px;
  height: 17px;
}

html[data-theme="light"] .icon-btn .moon-ic { display: block; }
html[data-theme="light"] .icon-btn .sun-ic { display: none; }
html[data-theme="dark"] .icon-btn .moon-ic { display: none; }
html[data-theme="dark"] .icon-btn .sun-ic { display: block; }

.lang {
  padding: 8px 18px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--paper);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-weight: 600;
  font-size: 0.86rem;
  color: var(--ink);
  box-shadow: var(--shadow-sm);
  transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.lang:hover {
  border-color: var(--teal);
  background: var(--tint);
  transform: translateY(-1px);
}

html[lang="en"] .lang {
  font-family: 'Noto Nastaliq Urdu', serif;
  font-size: 0.98rem;
  padding: 3px 18px;
}

/* ==========================================================================
   VIEWS & PAGE TRANSITIONS
   ========================================================================== */
.view {
  position: fixed;
  inset: 0;
  height: 100dvh;
  transition: transform 0.85s cubic-bezier(0.76, 0, 0.24, 1), opacity 0.6s ease;
}

#hero {
  z-index: 3;
  display: grid;
  grid-template-columns: minmax(430px, 0.88fr) minmax(0, 1.12fr);
  background: transparent;
  padding-top: env(safe-area-inset-top, 0px);
}

#deck {
  z-index: 1;
  display: grid;
  grid-template-rows: auto 1fr auto;
  opacity: 0;
  pointer-events: none;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

body.open #hero {
  transform: translateY(-102%);
}

body.open #deck {
  opacity: 1;
  pointer-events: auto;
  transition-delay: 0.2s;
}

/* ==========================================================================
   HERO VIEW (#hero) - COMPACT ZERO-DEAD-SPACE EDITORIAL LAYOUT
   ========================================================================== */
.hero-copy {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: clamp(10px, 1.4vh, 14px);
  padding: clamp(14px, 1.8vw, 24px) clamp(16px, 2.2vw, 30px);
  min-height: 0;
  height: 100%;
  overflow-y: auto;
  scrollbar-width: thin;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}

/* Compact Hero Banner Block */
.hero-banner-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: clamp(14px, 1.6vw, 20px);
  border-radius: 20px;
  background: var(--paper);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}

.hero-banner-card::before {
  content: "";
  position: absolute;
  inset-inline-start: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: linear-gradient(180deg, var(--teal), var(--copper));
}

.hero-eyebrow-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  width: fit-content;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--tint);
  border: 1px solid var(--line);
  font-size: 0.71rem;
  font-weight: 700;
  color: var(--teal);
}

.hero-eyebrow .dot-live {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--copper);
  box-shadow: 0 0 0 3px var(--copper-tint);
}

.hero-stat-pills {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--ink-3);
}

.hero-stat-pills span {
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--paper-subtle);
  border: 1px solid var(--line);
}

#hero h1 {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(1.65rem, 2.4vw, 2.55rem);
  line-height: 1.04;
  letter-spacing: -0.03em;
  text-wrap: balance;
  background: linear-gradient(135deg, var(--ink) 35%, var(--teal) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

html[lang="ur"] #hero h1 {
  line-height: 1.45;
  font-size: clamp(1.45rem, 2.1vw, 2.15rem);
}

.hero-lede-cta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 4px;
}

#hero .lede {
  font-size: clamp(0.88rem, 1vw, 0.98rem);
  line-height: 1.45;
  color: var(--ink-2);
  flex: 1 1 240px;
  margin: 0;
}

html[lang="ur"] #hero .lede {
  line-height: 1.85;
  font-size: clamp(0.84rem, 0.96vw, 0.94rem);
}

.cta {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  padding: 5px;
  padding-inline-start: 18px;
  border-radius: 999px;
  background: linear-gradient(135deg, #0F2A36 0%, #091B24 100%);
  color: #fff;
  font-weight: 600;
  font-size: 0.86rem;
  box-shadow: 0 10px 24px -8px rgba(11, 29, 38, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.18);
  transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  width: fit-content;
  flex: none;
  border: 1px solid rgba(255, 255, 255, 0.12);
}

html[data-theme="dark"] .cta {
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-d) 100%);
}

.cta .dot {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--copper-l) 0%, var(--copper) 100%);
  display: grid;
  place-items: center;
  box-shadow: 0 4px 12px rgba(212, 122, 57, 0.45);
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.cta svg {
  width: 16px;
  height: 16px;
}

html[dir="rtl"] .cta svg {
  transform: scaleX(-1);
}

.cta:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 30px -8px rgba(13, 122, 133, 0.45);
}

.cta:hover .dot {
  transform: translateX(3px) scale(1.04);
}

html[dir="rtl"] .cta:hover .dot {
  transform: translateX(-3px) scale(1.04);
}

.cta:active {
  transform: scale(0.98);
}

/* Middle Interactive Directory Container (Fills vertical space cleanly) */
.hero-directory-wrap {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: clamp(8px, 1.2vh, 12px);
  min-height: 0;
}

/* Hero Sections (Taglines + Labs Directory) */
.hero-sec {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.hero-sec-labs {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.hero-sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--ink-3);
}

html[lang="ur"] .hero-sec-head {
  font-size: 0.78rem;
  text-transform: none;
}

.hero-sec-head::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--line-strong), transparent);
}

html[dir="rtl"] .hero-sec-head::after {
  background: linear-gradient(-90deg, var(--line-strong), transparent);
}

/* Tagline / Slide Question Chips */
.chips {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
  gap: 5px;
}

.chips button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 11px;
  border-radius: 10px;
  background: var(--paper);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  font-size: 0.76rem;
  font-weight: 600;
  color: var(--ink);
  box-shadow: var(--shadow-sm);
  text-align: start;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.chips button::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--copper), var(--gold));
  flex: none;
  transition: transform 0.2s;
}

.chips button:hover {
  border-color: var(--teal);
  background: var(--tint);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.chips button:hover::before {
  transform: scale(1.35);
}

html[lang="ur"] .chips button {
  line-height: 1.7;
  padding: 3px 11px;
  font-size: 0.75rem;
}

/* All 11 Laboratories Directory Bento Grid (Expands to eliminate dead space) */
.labs-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(182px, 1fr));
  grid-auto-rows: 1fr;
  gap: 6px;
  direction: ltr;
}

.lab-pill {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 10px;
  border-radius: 12px;
  background: var(--paper);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  text-align: left;
  box-shadow: var(--shadow-sm);
  transition: all 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
  min-width: 0;
  position: relative;
  overflow: hidden;
}

.lab-pill:hover, .lab-pill.active-preview {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

html[data-theme="dark"] .lab-pill:hover,
html[data-theme="dark"] .lab-pill.active-preview {
  background: linear-gradient(135deg, #163342 0%, #0E232E 100%);
  color: #fff;
  border-color: var(--teal);
}

.lab-pill .num {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 0.68rem;
  color: var(--teal);
  background: var(--tint);
  padding: 3px 6px;
  border-radius: 6px;
  flex: none;
  transition: background 0.2s, color 0.2s;
}

.lab-pill:hover .num, .lab-pill.active-preview .num {
  background: linear-gradient(135deg, var(--copper), var(--gold));
  color: #fff;
}

.lab-pill .nm-wrap {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}

.lab-pill .nm {
  font-family: 'Figtree', sans-serif;
  font-size: 0.77rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lab-pill .sub-spec {
  font-family: var(--mono);
  font-size: 0.62rem;
  opacity: 0.65;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lab-pill .arr {
  width: 13px;
  height: 13px;
  opacity: 0;
  transform: translateX(-5px);
  transition: all 0.22s ease;
  flex: none;
  color: var(--copper-l);
}

.lab-pill:hover .arr, .lab-pill.active-preview .arr {
  opacity: 1;
  transform: translateX(0);
}

.hero-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 20px;
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--ink-2);
  flex: none;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}

.hero-foot div {
  display: flex;
  align-items: center;
  gap: 7px;
}

.hero-foot svg {
  width: 15px;
  height: 15px;
  color: var(--teal);
  flex: none;
}

/* ==========================================================================
   WIDE EXPANSIVE HERO VISUAL EXHIBITION FRAME (.hero-visual & .hero-art)
   ========================================================================== */
.hero-visual {
  display: flex;
  align-items: stretch;
  justify-content: stretch;
  padding: clamp(12px, 1.6vw, 22px);
  padding-inline-start: 0;
  min-height: 0;
  min-width: 0;
  height: 100%;
  position: relative;
  z-index: 2;
}

html[dir="rtl"] .hero-visual {
  padding-inline-start: clamp(12px, 1.6vw, 22px);
  padding-inline-end: 0;
}

.hero-art {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: none;
  border-radius: clamp(22px, 2.2vw, 34px);
  overflow: hidden;
  background: #0F2630;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--glass-border);
  cursor: pointer;
}

.hero-art::before {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: clamp(16px, 2vw, 28px);
  border: 1px solid rgba(255, 255, 255, 0.16);
  z-index: 3;
  pointer-events: none;
}

.hero-art::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(8, 20, 26, 0.35) 0%,
    transparent 30%,
    transparent 52%,
    rgba(8, 20, 26, 0.82) 100%
  );
  z-index: 1;
  pointer-events: none;
}

.hero-art svg.s {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.hero-art img.hero-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1), opacity 0.45s ease;
}

.hero-art:hover img.hero-img {
  transform: scale(1.04);
}

.hero-art .band {
  animation: rise 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}

@keyframes rise {
  from { transform: translateY(50px); opacity: 0; }
  to { transform: none; opacity: 1; }
}

.vein-glow {
  stroke-dasharray: 18 10;
  animation: veinFlow 16s linear infinite;
}

@keyframes veinFlow {
  to { stroke-dashoffset: -280; }
}

.hero-badge-top {
  position: absolute;
  z-index: 4;
  inset-inline-start: clamp(20px, 2.2vw, 30px);
  top: clamp(20px, 2.2vw, 30px);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(11, 29, 38, 0.76);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: #fff;
  padding: 7px 14px;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 600;
  direction: ltr;
  border: 1px solid rgba(255, 255, 255, 0.18);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
}

.hero-badge-top .pulse {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #28C780;
  box-shadow: 0 0 0 4px rgba(40, 199, 128, 0.25);
  animation: pulseGlow 2.4s infinite ease-in-out;
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 0 3px rgba(40, 199, 128, 0.2); }
  50% { box-shadow: 0 0 0 7px rgba(40, 199, 128, 0.38); }
}

.hero-spec-badge {
  position: absolute;
  z-index: 4;
  inset-inline-end: clamp(20px, 2.2vw, 30px);
  top: clamp(20px, 2.2vw, 30px);
  background: rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: #fff;
  padding: 6px 13px;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 600;
  direction: ltr;
  border: 1px solid rgba(255, 255, 255, 0.22);
}

.hero-tag {
  position: absolute;
  z-index: 4;
  inset-inline-start: clamp(20px, 2.2vw, 30px);
  bottom: clamp(20px, 2.2vw, 30px);
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 20px;
  padding: 14px 18px;
  font-size: 0.8rem;
  color: #2A434E;
  line-height: 1.4;
  max-width: 240px;
  box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.6);
}

html[lang="ur"] .hero-tag {
  line-height: 1.9;
}

.hero-tag b {
  display: block;
  color: #0B1D26;
  font-family: var(--display);
  font-size: 1.75rem;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 4px;
  background: linear-gradient(135deg, #0B1D26 0%, #0D7A85 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-preview-pill {
  position: absolute;
  z-index: 4;
  inset-inline-end: clamp(20px, 2.2vw, 30px);
  bottom: clamp(20px, 2.2vw, 30px);
  direction: ltr;
  background: rgba(11, 29, 38, 0.86);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: #fff;
  border-radius: 16px;
  padding: 11px 16px;
  font-size: 0.82rem;
  font-weight: 600;
  line-height: 1.35;
  border: 1px solid rgba(255, 255, 255, 0.18);
  max-width: 52%;
  box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.45);
  transition: transform 0.25s ease, border-color 0.25s ease;
}

.hero-art:hover .hero-preview-pill {
  border-color: var(--copper-l);
  transform: translateY(-2px);
}

.hero-preview-pill small {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-family: var(--mono);
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--gold);
  font-weight: 600;
  margin-bottom: 3px;
}

/* ==========================================================================
   SLIDE DECK VIEW (#deck)
   ========================================================================== */
.bar, .foot {
  direction: ltr;
  position: relative;
  z-index: 2;
}

.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px clamp(16px, 3vw, 42px);
  border-bottom: 1px solid var(--line);
  background: var(--paper-subtle);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.home {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 8px 18px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--paper);
  font-weight: 600;
  font-size: 0.86rem;
  box-shadow: var(--shadow-sm);
  transition: all 0.22s ease;
}

.home:hover {
  border-color: var(--teal);
  background: var(--tint);
  transform: translateY(-1px);
}

.home svg {
  width: 16px;
  height: 16px;
  color: var(--teal);
}

html[lang="ur"] .home {
  padding: 3px 18px;
}

.deck-status {
  display: flex;
  align-items: center;
  gap: 14px;
}

.count {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 0.92rem;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  background: var(--paper);
  padding: 5px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
}

.count b {
  color: var(--ink);
  font-size: 1.05rem;
}

.viewport {
  overflow: hidden;
  min-height: 0;
  position: relative;
  z-index: 2;
}

.track {
  display: flex;
  height: 100%;
  direction: ltr;
  transition: transform 0.72s cubic-bezier(0.76, 0, 0.24, 1);
}

.slide {
  flex: 0 0 100%;
  height: 100%;
  direction: inherit;
  display: grid;
  grid-template-columns: minmax(0, 0.96fr) minmax(0, 1.04fr);
  gap: clamp(20px, 3vw, 48px);
  padding: clamp(12px, 1.8vh, 22px) clamp(16px, 3vw, 42px);
}

html[dir="rtl"] .slide {
  direction: rtl;
}

/* Slide Visual Exhibition Showcase (.pic) */
.pic {
  position: relative;
  border-radius: clamp(22px, 2.4vw, 34px);
  overflow: hidden;
  min-height: 0;
  background: #0F2630;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--glass-border);
}

.pic::before {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: clamp(14px, 1.8vw, 24px);
  border: 1px solid rgba(255, 255, 255, 0.16);
  z-index: 2;
  pointer-events: none;
}

.pic::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(8, 20, 26, 0.28) 0%,
    transparent 35%,
    transparent 55%,
    rgba(8, 20, 26, 0.82) 100%
  );
  z-index: 1;
  pointer-events: none;
}

.pic svg.ph {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.pic img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1.07);
  transition: transform 1.6s cubic-bezier(0.2, 0.7, 0.2, 1);
}

.slide.on .pic img {
  transform: scale(1);
}

.pic .chip {
  position: absolute;
  z-index: 3;
  inset-inline-start: 22px;
  top: 22px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 999px;
  padding: 7px 16px;
  font-size: 0.82rem;
  font-weight: 700;
  color: #0B1D26;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.pic .chip::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--copper);
}

html[lang="ur"] .pic .chip {
  padding: 2px 16px;
  line-height: 1.9;
}

.pic .res-pill {
  position: absolute;
  z-index: 3;
  inset-inline-end: 22px;
  top: 22px;
  direction: ltr;
  background: rgba(11, 29, 38, 0.76);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 999px;
  padding: 6px 13px;
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 600;
}

.pic .tn {
  position: absolute;
  z-index: 3;
  inset-inline-start: 22px;
  bottom: 22px;
  max-width: 62%;
  direction: ltr;
  background: rgba(11, 29, 38, 0.84);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 14px;
  padding: 10px 16px;
  font-size: 0.84rem;
  font-weight: 600;
  line-height: 1.3;
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
}

.pic .tn small {
  display: block;
  font-family: var(--mono);
  font-size: 0.64rem;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 2px;
}

.pic .big {
  position: absolute;
  z-index: 3;
  inset-inline-end: 24px;
  bottom: 8px;
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(4.2rem, 8.5vw, 7.6rem);
  line-height: 1;
  color: rgba(255, 255, 255, 0.88);
  letter-spacing: -0.04em;
  text-shadow: 0 8px 34px rgba(0, 0, 0, 0.45);
  pointer-events: none;
}

/* Slide Editorial Info Panel (.info) */
.info {
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding: 4px 10px 10px 2px;
  scrollbar-width: thin;
  gap: clamp(10px, 1.5vh, 16px);
}

html[dir="rtl"] .info {
  padding: 4px 2px 10px 10px;
}

.info-header {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.code-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.code {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-weight: 600;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--teal);
  background: var(--tint);
  padding: 4px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
}

.code::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--copper);
}

.target-pill {
  font-family: var(--mono);
  font-size: 0.74rem;
  color: var(--ink-3);
  background: var(--paper);
  padding: 4px 11px;
  border-radius: 999px;
  border: 1px solid var(--line);
  direction: ltr;
}

.info h2 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(1.55rem, 2.7vw, 2.55rem);
  line-height: 1.08;
  letter-spacing: -0.03em;
  text-wrap: balance;
  color: var(--ink);
}

html[lang="ur"] .info h2 {
  line-height: 1.6;
  font-size: clamp(1.38rem, 2.3vw, 2.15rem);
}

.sec-card {
  background: var(--paper);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px 18px;
  box-shadow: var(--shadow-sm);
}

.sec h3, .sec-card h3 {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-weight: 700;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--teal);
  margin-bottom: 6px;
}

html[lang="ur"] .sec h3, html[lang="ur"] .sec-card h3 {
  line-height: 1.9;
  text-transform: none;
  font-size: 0.88rem;
}

.sec p, .sec-card p {
  font-size: clamp(0.95rem, 1.1vw, 1.05rem);
  line-height: 1.55;
  color: var(--ink-2);
}

html[lang="ur"] .sec p, html[lang="ur"] .sec-card p {
  line-height: 2.05;
  font-size: clamp(0.9rem, 1.05vw, 1rem);
}

/* Highlighted Key Insight Callout (.wow) */
.wow {
  position: relative;
  background: linear-gradient(135deg, var(--tint) 0%, var(--copper-tint) 100%);
  border-radius: 18px;
  border: 1px solid var(--line);
  border-inline-start: 5px solid var(--copper);
  padding: 14px 18px;
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(1.02rem, 1.38vw, 1.32rem);
  line-height: 1.32;
  letter-spacing: -0.015em;
  color: var(--ink);
  text-wrap: balance;
  box-shadow: var(--shadow-sm);
}

html[lang="ur"] .wow {
  line-height: 1.9;
  font-size: clamp(0.96rem, 1.3vw, 1.2rem);
}

/* Bento Grid for "What You Get" & "What To Bring" */
.two {
  display: grid;
  grid-template-columns: minmax(0, 1.42fr) minmax(0, 1fr);
  gap: 12px;
}

.bento-box {
  background: var(--paper);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
}

.caps {
  list-style: none;
  display: grid;
  gap: 8px;
}

.caps li {
  display: flex;
  gap: 10px;
  font-size: 0.91rem;
  line-height: 1.42;
  color: var(--ink);
  font-weight: 500;
}

html[lang="ur"] .caps li {
  line-height: 1.9;
  font-size: 0.88rem;
}

.caps svg {
  width: 19px;
  height: 19px;
  flex: none;
  margin-top: 1px;
  color: var(--teal);
}

html[lang="ur"] .caps svg {
  margin-top: 8px;
}

.bring {
  background: var(--paper);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px dashed var(--line-strong);
  border-radius: 18px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--shadow-sm);
}

.bring-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}

.bring svg {
  width: 24px;
  height: 24px;
  color: var(--copper);
  flex: none;
}

.bring p {
  font-size: 0.91rem;
  line-height: 1.45;
  color: var(--ink-2);
  font-weight: 500;
}

html[lang="ur"] .bring p {
  line-height: 1.95;
  font-size: 0.86rem;
}

/* Action & Technical Datasheet Strip */
.slide-actions-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
}

.ptbtn {
  display: inline-flex;
  width: fit-content;
  max-width: 100%;
  align-items: center;
  gap: 12px;
  padding: 7px 16px 7px 8px;
  border-radius: 14px;
  background: var(--paper);
  border: 1px solid var(--line-strong);
  font-weight: 600;
  font-size: 0.88rem;
  color: var(--ink);
  text-align: start;
  box-shadow: var(--shadow-sm);
  transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}

html[dir="rtl"] .ptbtn {
  padding: 7px 8px 7px 16px;
}

.ptbtn:hover {
  border-color: var(--teal);
  background: var(--tint);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.ptbtn .ic {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-d) 100%);
  display: grid;
  place-items: center;
  flex: none;
  box-shadow: 0 4px 10px rgba(13, 122, 133, 0.3);
}

.ptbtn .ic svg {
  width: 18px;
  height: 18px;
}

.ptbtn .cnt {
  background: linear-gradient(135deg, var(--copper), var(--gold));
  color: #fff;
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 0.76rem;
  font-weight: 700;
  flex: none;
  font-family: var(--mono);
}

html[lang="ur"] .ptbtn {
  line-height: 1.85;
  font-size: 0.84rem;
}

/* Collapsible / Integrated Technical Datasheet */
details.tech {
  font-size: 0.83rem;
  color: var(--ink-2);
  direction: inherit;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 10px 16px;
  box-shadow: var(--shadow-sm);
}

details.tech summary {
  cursor: pointer;
  font-weight: 700;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-2);
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

html[lang="ur"] details.tech summary {
  text-transform: none;
  font-size: 0.85rem;
}

details.tech summary::-webkit-details-marker {
  display: none;
}

details.tech summary::after {
  content: "+";
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--tint);
  color: var(--teal);
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 0.95rem;
  line-height: 1;
  transition: transform 0.25s ease, background 0.25s ease;
}

details.tech[open] summary::after {
  content: "−";
  background: var(--copper-tint);
  color: var(--copper);
}

details.tech dl {
  direction: ltr;
  text-align: left;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 7px 16px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  font-family: 'Figtree', sans-serif;
  line-height: 1.4;
}

details.tech dt {
  font-family: var(--mono);
  font-size: 0.74rem;
  text-transform: uppercase;
  color: var(--ink-3);
}

details.tech dd {
  color: var(--ink);
  font-weight: 500;
}

/* ==========================================================================
   BOTTOM NAVIGATION RAIL (.foot)
   ========================================================================== */
.foot {
  display: flex;
  align-items: center;
  gap: clamp(10px, 1.8vw, 22px);
  padding: 10px clamp(16px, 3vw, 42px) 16px;
  border-top: 1px solid var(--line);
  background: var(--paper-subtle);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.arrow {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--paper);
  display: grid;
  place-items: center;
  flex: none;
  box-shadow: var(--shadow-sm);
  transition: all 0.22s ease;
}

.arrow:hover:not(:disabled) {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
  transform: scale(1.05);
}

.arrow:disabled {
  opacity: 0.32;
  cursor: default;
}

.arrow svg {
  width: 19px;
  height: 19px;
}

.rail {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(11, minmax(0, 1fr));
  gap: 8px;
}

.rail button {
  position: relative;
  text-align: start;
  padding: 10px 4px 2px;
  font-size: 0.76rem;
  font-weight: 600;
  color: var(--ink-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color 0.2s, transform 0.2s;
  unicode-bidi: plaintext;
}

html[lang="ur"] .rail button {
  line-height: 1.85;
  padding-top: 6px;
  font-size: 0.74rem;
}

.rail button::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 4px;
  border-radius: 999px;
  background: var(--line-strong);
  transition: all 0.3s ease;
}

.rail button:hover, .rail button.on {
  color: var(--ink);
}

.rail button.on::before {
  background: linear-gradient(90deg, var(--copper), var(--gold));
  height: 5px;
  box-shadow: 0 2px 8px rgba(212, 122, 57, 0.45);
}

.rail button.seen::before {
  background: var(--teal);
  opacity: 0.55;
}

.rail button.on.seen::before {
  background: linear-gradient(90deg, var(--copper), var(--gold));
  opacity: 1;
}

/* ==========================================================================
   PERIODIC TABLE MODAL (#ptModal)
   ========================================================================== */
.modal {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  padding: clamp(10px, 2.2vw, 28px);
  background: rgba(8, 18, 23, 0.62);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.32s ease, visibility 0.32s ease;
}

.modal.show {
  opacity: 1;
  visibility: visible;
}

.sheet {
  width: min(1200px, 100%);
  max-height: 100%;
  overflow: auto;
  background: var(--paper-solid);
  border: 1px solid var(--line-strong);
  border-radius: clamp(22px, 2.4vw, 32px);
  padding: clamp(18px, 2.4vw, 30px);
  box-shadow: var(--shadow-lg);
  transform: translateY(24px) scale(0.97);
  transition: transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.modal.show .sheet {
  transform: none;
}

.sheet header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: clamp(12px, 1.8vh, 18px);
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}

.sheet h2 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(1.3rem, 2.2vw, 1.85rem);
  line-height: 1.15;
  letter-spacing: -0.02em;
}

html[lang="ur"] .sheet h2 {
  line-height: 1.65;
  font-size: clamp(1.15rem, 1.9vw, 1.6rem);
}

.sheet header p {
  margin-top: 4px;
  color: var(--teal);
  font-family: var(--mono);
  font-size: 0.84rem;
  font-weight: 600;
}

.x {
  width: 42px;
  height: 42px;
  flex: none;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--paper);
  display: grid;
  place-items: center;
  transition: all 0.2s ease;
}

.x:hover {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
  transform: rotate(90deg);
}

.x svg {
  width: 18px;
  height: 18px;
}

.ptwrap {
  overflow-x: auto;
  direction: ltr;
  padding-bottom: 6px;
}

.pt {
  container-type: inline-size;
  display: grid;
  grid-template-columns: repeat(18, 1fr);
  grid-template-rows: repeat(7, 1fr) 0.32fr repeat(2, 1fr);
  gap: 3.5px;
  aspect-ratio: 18 / 9.6;
  min-width: 720px;
  width: min(100%, calc((100dvh - 260px) * 1.8));
  margin-inline: auto;
}

.cell {
  position: relative;
  border-radius: clamp(4px, 0.55cqw, 8px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--cell-off);
  color: var(--cell-off-txt);
  line-height: 1;
  cursor: pointer;
  user-select: none;
  border: 1px solid transparent;
  transition:
    background 0.35s var(--d, 0ms),
    color 0.35s var(--d, 0ms),
    transform 0.16s ease,
    box-shadow 0.16s ease;
}

.cell i {
  font-style: normal;
  font-family: var(--mono);
  font-size: max(7px, 0.8cqw);
  opacity: 0.78;
  margin-bottom: 2px;
}

.cell b {
  font-family: var(--display);
  font-weight: 700;
  font-size: max(11px, 2cqw);
}

.pt.lit .cell.on {
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-d) 100%);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.2);
  box-shadow: 0 3px 10px -2px rgba(13, 122, 133, 0.35);
}

.cell:hover, .cell.sel {
  transform: scale(1.16);
  z-index: 3;
  box-shadow: 0 10px 24px -6px rgba(11, 29, 38, 0.45);
  outline: 2px solid var(--copper);
}

.lbl {
  grid-column: 3;
  display: grid;
  place-items: center;
  text-align: center;
  font-size: max(7px, 0.78cqw);
  color: var(--ink-3);
  font-family: var(--mono);
}

.ptfoot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px 24px;
  margin-top: clamp(12px, 1.8vh, 18px);
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--ink-2);
}

.legend > span {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.sw {
  width: 16px;
  height: 16px;
  border-radius: 5px;
  background: var(--cell-off);
  border: 1px solid var(--line-strong);
}

.sw.on {
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-d) 100%);
  border-color: var(--teal);
}

.read {
  font-size: 0.95rem;
  color: var(--ink-2);
  min-height: 2.2em;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--paper);
  padding: 6px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
}

.read b {
  font-family: var(--display);
  font-size: 1.2rem;
  color: var(--ink);
  margin-inline-end: 4px;
}

.read .yes {
  color: #fff;
  background: var(--teal);
  font-size: 0.76rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 999px;
  margin-inline-start: 6px;
}

.read .no {
  color: var(--ink-3);
  background: var(--cell-off);
  font-size: 0.76rem;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 999px;
  margin-inline-start: 6px;
}

html[lang="ur"] .read, html[lang="ur"] .legend {
  line-height: 1.9;
}

.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ==========================================================================
   RESPONSIVE ADAPTATIONS
   ========================================================================== */
@media (max-width: 1024px) {
  #hero {

  }

}

  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition-duration: 0.01ms !important;
  }
}

/* ============ Enhanced Procedural Geological Strata Artwork ============ */
const NS = "http://www.w3.org/2000/svg";
function strata(svg, W, H, hue, animate){
  svg.innerHTML = "";

  // Rich background sky/crust gradient
  const defs = document.createElementNS(NS, "defs");
  const gradId = "g_" + Math.random().toString(36).slice(2, 7);
  defs.innerHTML = `
    <linearGradient id="${gradId}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(${hue} 38% 18%)"/>
      <stop offset="100%" stop-color="hsl(${hue + 20} 45% 10%)"/>
    </linearGradient>
  `;
  svg.appendChild(defs);

  const bgRect = document.createElementNS(NS, "rect");
  bgRect.setAttribute("width", W);
  bgRect.setAttribute("height", H);
  bgRect.setAttribute("fill", `url(#${gradId})`);
  svg.appendChild(bgRect);

  const n = 9, veinIdx = 5;
  let veinD = "";
  for (let i = 0; i < n; i++){
    const base = H * (0.1 + i * (0.9 / n));
    const amp = 18 + (i % 3) * 15;
    const f = 1.2 + (i % 2) * 0.5;
    const ph = i * 0.9 + hue * 0.025;
    const tilt = (i % 2 ? -1 : 1) * H * 0.05;
    let d = "";
    for (let x = 0; x <= W; x += 20){
      const y = base + amp * Math.sin((x / W) * Math.PI * 2 * f + ph) + (x / W) * tilt;
      d += (x ? "L" : "M") + x + "," + y.toFixed(1);
    }
    if (i === veinIdx) veinD = d;
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d + `L${W},${H}L0,${H}Z`);
    const lightness = 76 - i * 6.5;
    p.setAttribute("fill", `hsl(${(hue + i * 5) % 360} ${28 + i * 2}% ${lightness}%)`);
    p.setAttribute("stroke", "rgba(255,255,255,0.22)");
    p.setAttribute("stroke-width", "1.2");
    if (animate){
      p.setAttribute("class", "band");
      p.style.animationDelay = (i * 0.07) + "s";
    }
    svg.appendChild(p);
  }

  // Primary Copper Ore Vein
  const vein = document.createElementNS(NS, "path");
  vein.setAttribute("d", veinD);
  vein.setAttribute("fill", "none");
  vein.setAttribute("stroke", "#D47A39");
  vein.setAttribute("stroke-width", "6");
  vein.setAttribute("stroke-linecap", "round");
  if (animate){
    vein.setAttribute("class", "band");
    vein.style.animationDelay = (veinIdx * 0.07 + 0.12) + "s";
  }
  svg.appendChild(vein);

  // Shimmering Gold Highlight Vein
  const veinShimmer = document.createElementNS(NS, "path");
  veinShimmer.setAttribute("d", veinD);
  veinShimmer.setAttribute("fill", "none");
  veinShimmer.setAttribute("stroke", "#F0B849");
  veinShimmer.setAttribute("stroke-width", "2.2");
  veinShimmer.setAttribute("stroke-linecap", "round");
  veinShimmer.setAttribute("class", "vein-glow");
  svg.appendChild(veinShimmer);
}

function updateHeroPreview(i) {
  featuredHeroLabIdx = i;
  const it = instruments[i];
  const previewName = document.getElementById("heroPreviewName");
  const previewTag = document.getElementById("heroPreviewTag");
  const specBadge = document.getElementById("heroSpecBadge");
  const badgeCode = document.getElementById("heroBadgeCode");

  if (previewName) previewName.textContent = `${String(i + 1).padStart(2, "0")} · ${it.name}`;
  if (previewTag) previewTag.textContent = it[lang].tag;
  if (specBadge) specBadge.textContent = it.resolution;
  if (badgeCode) badgeCode.textContent = `LAB ${String(i + 1).padStart(2, "0")} • ${it.status.toUpperCase()}`;

  if (heroStrata) strata(heroStrata, 800, 700, 170 + i * 14, false);
  if (heroImg) {
    heroImg.style.display = "";
    heroImg.src = it.image;
  }

  document.querySelectorAll(".lab-pill").forEach((pill, idx) => {
    pill.classList.toggle("active-preview", idx === i);
  });
}

const ELEMENTS = "H Hydrogen,He Helium,Li Lithium,Be Beryllium,B Boron,C Carbon,N Nitrogen,O Oxygen,F Fluorine,Ne Neon,Na Sodium,Mg Magnesium,Al Aluminium,Si Silicon,P Phosphorus,S Sulfur,Cl Chlorine,Ar Argon,K Potassium,Ca Calcium,Sc Scandium,Ti Titanium,V Vanadium,Cr Chromium,Mn Manganese,Fe Iron,Co Cobalt,Ni Nickel,Cu Copper,Zn Zinc,Ga Gallium,Ge Germanium,As Arsenic,Se Selenium,Br Bromine,Kr Krypton,Rb Rubidium,Sr Strontium,Y Yttrium,Zr Zirconium,Nb Niobium,Mo Molybdenum,Tc Technetium,Ru Ruthenium,Rh Rhodium,Pd Palladium,Ag Silver,Cd Cadmium,In Indium,Sn Tin,Sb Antimony,Te Tellurium,I Iodine,Xe Xenon,Cs Caesium,Ba Barium,La Lanthanum,Ce Cerium,Pr Praseodymium,Nd Neodymium,Pm Promethium,Sm Samarium,Eu Europium,Gd Gadolinium,Tb Terbium,Dy Dysprosium,Ho Holmium,Er Erbium,Tm Thulium,Yb Ytterbium,Lu Lutetium,Hf Hafnium,Ta Tantalum,W Tungsten,Re Rhenium,Os Osmium,Ir Iridium,Pt Platinum,Au Gold,Hg Mercury,Tl Thallium,Pb Lead,Bi Bismuth,Po Polonium,At Astatine,Rn Radon,Fr Francium,Ra Radium,Ac Actinium,Th Thorium,Pa Protactinium,U Uranium,Np Neptunium,Pu Plutonium,Am Americium,Cm Curium,Bk Berkelium,Cf Californium,Es Einsteinium,Fm Fermium,Md Mendelevium,No Nobelium,Lr Lawrencium,Rf Rutherfordium,Db Dubnium,Sg Seaborgium,Bh Bohrium,Hs Hassium,Mt Meitnerium,Ds Darmstadtium,Rg Roentgenium,Cn Copernicium,Nh Nihonium,Fl Flerovium,Mc Moscovium,Lv Livermorium,Ts Tennessine,Og Oganesson".split(",").map(s => s.split(" "));
const SYM = ELEMENTS.map(e => e[0]);
const NAMES = ELEMENTS.map(e => e[1]);

/* ---- Scientifically verified elements each instrument measures reliably ---- */
const EL = {
  semeds: "B C N O F Na Mg Al Si P S Cl K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Rb Sr Y Zr Nb Mo Ru Rh Pd Ag Cd In Sn Sb Te I Cs Ba La Ce Pr Nd Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Th U".split(" "),
  edxrf: "Na Mg Al Si P S Cl K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Rb Sr Y Zr Nb Mo Ag Cd In Sn Sb Te I Cs Ba La Ce Pr Nd Sm Hf Ta W Pt Au Hg Tl Pb Bi Th U".split(" "),
  mpaes: "Li Be B Na Mg Al Si P K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Rb Sr Y Zr Nb Mo Ru Rh Pd Ag Cd In Sn Sb Te Cs Ba La Ce Pr Nd Sm Eu Gd Tb Dy Ho Er Tm Yb Lu W Re Pt Au Tl Pb Bi".split(" "),
  xrf: "F Na Mg Al Si P S Cl K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Rb Sr Y Zr Nb Mo Ag Cd In Sn Sb Te I Cs Ba La Ce Pr Nd Sm Yb Hf Ta W Pt Au Hg Tl Pb Bi Th U".split(" "),
  aas: "Li Be Na Mg Al Si K Ca Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Rb Sr Mo Rh Pd Ag Cd In Sn Sb Te Cs Ba Pt Au Hg Tl Pb Bi".split(" "),
  icpms: "Li Be B Na Mg Al Si P S K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Rb Sr Y Zr Nb Mo Ru Rh Pd Ag Cd In Sn Sb Te I Cs Ba La Ce Pr Nd Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Th U".split(" ")
};
instruments[0].elements = EL.semeds;  // Scanning Electron Microscope (EDS)
instruments[3].elements = EL.edxrf;   // Energy Dispersive XRF (EDXRF)
instruments[4].elements = EL.mpaes;   // Microwave Plasma AES (MP-AES)
instruments[5].elements = EL.xrf;     // X-Ray Fluorescence Spectrometer (WDXRF)
instruments[7].elements = EL.aas;     // Atomic Absorption Spectrometer (AAS)
instruments[9].elements = EL.icpms;   // ICP-MS Agilent (Single Quadrupole)

function ptPos(z){
  if (z === 1) return [1, 1];
  if (z === 2) return [1, 18];
  if (z <= 4)  return [2, z - 2];
  if (z <= 10) return [2, z + 8];
  if (z <= 12) return [3, z - 10];
  if (z <= 18) return [3, z];
  if (z <= 36) return [4, z - 18];
  if (z <= 54) return [5, z - 36];
  if (z <= 56) return [6, z - 54];
  if (z <= 71) return [9, z - 54];
  if (z <= 86) return [6, z - 68];
  if (z <= 88) return [7, z - 86];
  if (z <= 103) return [10, z - 86];
  return [7, z - 100];
}

const ptModal = document.getElementById("ptModal");
const pt = document.getElementById("pt");
const ptClose = document.getElementById("ptClose");
const readout = document.getElementById("readout");
const cells = [];
for (let z = 1; z <= 118; z++){
  const [r, c] = ptPos(z);
  const d = document.createElement("div");
  d.className = "cell";
  d.style.gridRow = r; d.style.gridColumn = c;
  d.dataset.z = z;
  d.innerHTML = `<i>${z}</i><b>${SYM[z - 1]}</b>`;
  pt.appendChild(d);
  cells.push(d);
}
[[6, "57–71"], [7, "89–103"]].forEach(([r, t]) => {
  const l = document.createElement("div");
  l.className = "lbl"; l.style.gridRow = r; l.textContent = t;
  pt.appendChild(l);
});

function showRead(z){
  const on = cells[z - 1].classList.contains("on");
  const L = UI[lang];
  readout.innerHTML = `<b>${SYM[z - 1]}</b> ${NAMES[z - 1]} <span style="opacity:.6;font-family:var(--mono)">(#${z})</span><span class="${on ? "yes" : "no"}">${on ? L.legOn : L.legOff}</span>`;
  cells.forEach(c => c.classList.toggle("sel", c === cells[z - 1]));
}
["mouseover", "click"].forEach(ev => pt.addEventListener(ev, e => {
  const c = e.target.closest(".cell");
  if (c) showRead(+c.dataset.z);
}));

let ptOpener = null;
function openPT(i, opener){
  const L = UI[lang], it = instruments[i], set = new Set(it.elements);
  ptOpener = opener;
  document.getElementById("ptTitle").textContent = L.elTitle;
  document.getElementById("ptSub").textContent = `${it.name} • ${it.resolution}`;
  document.getElementById("legOn").textContent = `${L.legOn} (${it.elements.length})`;
  document.getElementById("legOff").textContent = L.legOff;
  ptClose.setAttribute("aria-label", L.close);
  readout.textContent = L.prompt;
  document.getElementById("ptList").textContent = it.elements.map(s => NAMES[SYM.indexOf(s)]).join(", ");
  pt.classList.remove("lit");
  let k = 0;
  cells.forEach((c, j) => {
    const on = set.has(SYM[j]);
    c.classList.toggle("on", on);
    c.classList.remove("sel");
    if (on) c.style.setProperty("--d", (k++ * 18) + "ms");
  });
  ptModal.classList.add("show");
  document.getElementById("deck").inert = true;
  requestAnimationFrame(() => requestAnimationFrame(() => pt.classList.add("lit")));
  ptClose.focus({preventScroll:true});
}
function closePT(){
  ptModal.classList.remove("show");
  document.getElementById("deck").inert = false;
  if (ptOpener) ptOpener.focus({preventScroll:true});
}
ptClose.addEventListener("click", closePT);
ptModal.addEventListener("click", e => { if (e.target === ptModal) closePT(); });

/* ============ Rendering ============ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" opacity=".22"/><path d="M8 12.5l3 3 5-6"/></svg>';
const bag = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l1.5 12h-15L6 8z"/><path d="M9 8V6.5a3 3 0 016 0V8"/></svg>';
const miniArr = '<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

const track = document.getElementById("track");
const rail = document.getElementById("rail");
const cur = document.getElementById("cur");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const seen = new Set();
let lang = "en", idx = 0;

function renderDeck(){
  const L = UI[lang];
  track.innerHTML = ""; rail.innerHTML = "";
  instruments.forEach((it, i) => {
    const c = it[lang];
    const numStr = String(i + 1).padStart(2, "0");
    const s = document.createElement("article");
    s.className = "slide";
    s.setAttribute("aria-label", c.q);
    s.innerHTML = `
      <div class="pic">
        <svg class="ph" viewBox="0 0 800 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
        <img src="${esc(it.image)}" alt="${esc(it.name)}" loading="${i < 2 ? "eager" : "lazy"}">
        <span class="chip">${esc(c.tag)}</span>
        <span class="res-pill">${esc(it.resolution)}</span>
        <span class="tn"><small>GARL • LAB ${numStr}</small>${esc(it.name)}</span>
        <span class="big" aria-hidden="true">${numStr}</span>
      </div>
      <div class="info">
        <div class="info-header">
          <div class="code-row">
            <span class="code">${esc(L.lab)} ${numStr}</span>
            <span class="target-pill">${esc(it.target)}</span>
          </div>
          <h2>${esc(c.q)}</h2>
        </div>

        <div class="sec-card">
          <h3>${esc(L.simple)}</h3>
          <p>${esc(c.simple)}</p>
        </div>

        <div class="wow">${esc(c.wow)}</div>

        <div class="two">
          <div class="bento-box">
            <div class="sec" style="margin:0">
              <h3>${esc(L.get)}</h3>
              <ul class="caps">${c.get.map(g => `<li>${check}<span>${esc(g)}</span></li>`).join("")}</ul>
            </div>
          </div>
          <div class="bring">
            <div>
              <div class="bring-top">
                <div class="sec" style="margin:0"><h3>${esc(L.bring)}</h3></div>
                ${bag}
              </div>
              <p>${esc(c.bring)}</p>
            </div>
          </div>
        </div>

        <div class="slide-actions-row">
          ${it.elements ? `<button class="ptbtn" type="button" data-pt="${i}"><span class="ic"><svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><rect x="2" y="3" width="4" height="4" rx="1"/><rect x="7" y="3" width="4" height="4" rx="1" opacity=".5"/><rect x="12" y="3" width="4" height="4" rx="1" opacity=".5"/><rect x="17" y="3" width="4" height="4" rx="1"/><rect x="2" y="8" width="4" height="4" rx="1" opacity=".5"/><rect x="7" y="8" width="4" height="4" rx="1"/><rect x="12" y="8" width="4" height="4" rx="1" opacity=".5"/><rect x="17" y="8" width="4" height="4" rx="1" opacity=".5"/><rect x="2" y="13" width="4" height="4" rx="1"/><rect x="7" y="13" width="4" height="4" rx="1" opacity=".5"/><rect x="12" y="13" width="4" height="4" rx="1"/><rect x="17" y="13" width="4" height="4" rx="1" opacity=".5"/></svg></span><span>${esc(L.elBtn)}</span><span class="cnt">${it.elements.length}</span></button>` : ""}
        </div>

        <details class="tech">
          <summary>${esc(L.tech)}</summary>
          <dl>
            <dt>Instrument</dt><dd>${esc(it.name)}</dd>
            <dt>Resolution</dt><dd>${esc(it.resolution)}</dd>
            <dt>Samples</dt><dd>${esc(it.target)}</dd>
            <dt>Capabilities</dt><dd>${it.capabilities.map(esc).join(" • ")}</dd>
            <dt>Status</dt><dd>${esc(it.status)}</dd>
          </dl>
        </details>
      </div>`;
    strata(s.querySelector("svg.ph"), 800, 700, 170 + i * 14, false);
    s.querySelector("img").addEventListener("error", e => e.target.remove());
    track.appendChild(s);

    const b = document.createElement("button");
    b.type = "button";
    b.textContent = c.short;
    b.title = c.tag;
    b.setAttribute("aria-label", c.q);
    b.addEventListener("click", () => go(i));
    rail.appendChild(b);
  });
  go(idx, true);
}

function renderHero(){
  const L = UI[lang];
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = L[el.dataset.i18n]; });

  /* Populate quick tagline chips */
  const chipsEl = document.getElementById("chips");
  chipsEl.innerHTML = "";
  QUICK.forEach(q => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = q[lang];
    b.addEventListener("mouseenter", () => updateHeroPreview(q.lab));
    b.addEventListener("click", () => openDeck(q.lab));
    chipsEl.appendChild(b);
  });

  /* Populate all 11 labs directory */
  const heroLabsEl = document.getElementById("heroLabs");
  heroLabsEl.innerHTML = "";
  instruments.forEach((it, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "lab-pill";
    btn.title = `${it.name} — ${it[lang].q}`;
    btn.innerHTML = `
      <span class="num">${String(i + 1).padStart(2, "0")}</span>
      <span class="nm-wrap">
        <span class="nm">${esc(it.name)}</span>
        <span class="sub-spec">${esc(it.resolution)}</span>
      </span>
      ${miniArr}
    `;
    btn.addEventListener("mouseenter", () => updateHeroPreview(i));
    btn.addEventListener("focus", () => updateHeroPreview(i));
    btn.addEventListener("click", () => openDeck(i));
    heroLabsEl.appendChild(btn);
  });

  document.querySelectorAll("[data-lang-btn]").forEach(b => { b.textContent = L.switchTo; });
}

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ur" ? "rtl" : "ltr";
  document.title = UI[l].title;
  renderHero();
  renderDeck();
}

/* ============ Theme Switcher (Alabaster Stone / Deep Basalt) ============ */
function toggleTheme(){
  const root = document.documentElement;
  const nextTheme = root.dataset.theme === "dark" ? "light" : "dark";
  root.dataset.theme = nextTheme;
}
document.querySelectorAll("[data-theme-btn]").forEach(b => b.addEventListener("click", toggleTheme));

/* ============ Navigation ============ */
function go(n, quiet){
  idx = Math.max(0, Math.min(instruments.length - 1, n));
  seen.add(idx);
  const slides = [...track.children], tabs = [...rail.children];
  track.style.transform = `translateX(${-idx * 100}%)`;
  slides.forEach((s, i) => { s.classList.toggle("on", i === idx); s.inert = i !== idx; });
  tabs.forEach((t, i) => {
    t.classList.toggle("on", i === idx);
    t.classList.toggle("seen", seen.has(i));
    if (i === idx) t.setAttribute("aria-current", "true"); else t.removeAttribute("aria-current");
  });
  cur.textContent = String(idx + 1).padStart(2, "0");
  prev.disabled = idx === 0;
  next.disabled = idx === instruments.length - 1;
}
function openDeck(n = 0){
  document.body.classList.add("open");
  document.getElementById("hero").inert = true;
  document.getElementById("deck").inert = false;
  go(n);
}
function closeDeck(){
  document.body.classList.remove("open");
  document.getElementById("hero").inert = false;
  document.getElementById("deck").inert = true;
  seen.clear();
}

document.getElementById("explore").addEventListener("click", () => openDeck(0));
document.getElementById("home").addEventListener("click", closeDeck);
document.querySelectorAll("[data-lang-btn]").forEach(b => b.addEventListener("click", () => setLang(lang === "en" ? "ur" : "en")));
track.addEventListener("click", e => {
  const b = e.target.closest("[data-pt]");
  if (b) openPT(+b.dataset.pt, b);
});
prev.addEventListener("click", () => go(idx - 1));
next.addEventListener("click", () => go(idx + 1));

window.addEventListener("keydown", e => {
  if (ptModal.classList.contains("show")){
    if (e.key === "Escape") closePT();
    else if (e.key === "Tab"){ e.preventDefault(); ptClose.focus(); }
    return;
  }
  const open = document.body.classList.contains("open");
  if (!open){ if (e.key === "Enter" && document.activeElement === document.body) openDeck(0); return; }
  if (e.key === "ArrowRight") go(idx + 1);
  else if (e.key === "ArrowLeft") go(idx - 1);
  else if (e.key === "Escape") closeDeck();
});

/* Touch Swipe Support */
let sx = null, sy = null;
const vp = document.querySelector(".viewport");
vp.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
vp.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) go(idx + (dx < 0 ? 1 : -1));
  sx = sy = null;
}, {passive:true});

document.getElementById("deck").inert = true;
setLang("en");
</script>
