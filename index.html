<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geoscience Advanced Research Laboratories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F8;
  --paper:#FFFFFF;
  --ink:#0F2A36;
  --ink-2:#44606C;
  --ink-3:#7A929C;
  --line:#DDE5EA;
  --teal:#0C6E78;
  --teal-d:#09535B;
  --tint:#E6F2F3;
  --copper:#C77B3F;
  --ok:#1E8E5A;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
html[lang=ur]{--display:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Segoe UI',serif;--body:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Segoe UI',serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:8px}
html[lang=ur] *{letter-spacing:0!important}

/* ---------- shared ---------- */
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--ink);display:grid;place-items:center;flex:none}
.brand-mark svg{width:20px;height:20px}
.brand b{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.01em}
.brand span{display:block;font-size:.72rem;color:var(--ink-3);font-weight:500;margin-top:1px}
.lang{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:.88rem;transition:border-color .2s,background .2s}
.lang:hover{border-color:var(--teal);background:#F0F8F8}
html[lang=en] .lang{font-family:'Noto Nastaliq Urdu',serif;font-size:1rem;padding:4px 16px}

/* ---------- views ---------- */
.view{position:fixed;inset:0;height:100dvh;transition:transform .9s cubic-bezier(.76,0,.24,1),opacity .6s ease}
#hero{z-index:3;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
#deck{z-index:1;display:grid;grid-template-rows:auto 1fr auto;opacity:0;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.open #hero{transform:translateY(-100%)}
body.open #deck{opacity:1;pointer-events:auto;transition-delay:.25s}

/* ---------- hero ---------- */
.hero-copy{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding:clamp(24px,4vw,56px) clamp(24px,5vw,80px) clamp(24px,4vw,48px);min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero-main{max-width:700px;margin-block:auto}
#hero h1{font-family:var(--display);font-weight:600;font-size:clamp(2.5rem,5.6vw,5.4rem);line-height:.98;letter-spacing:-.035em;text-wrap:balance}
html[lang=ur] #hero h1{line-height:1.5;font-size:clamp(2rem,4.4vw,4.1rem)}
#hero .lede{margin-top:clamp(16px,2.4vh,28px);font-size:clamp(1.05rem,1.45vw,1.3rem);line-height:1.5;color:var(--ink-2);max-width:30em}
html[lang=ur] #hero .lede{line-height:2.1;font-size:clamp(.95rem,1.25vw,1.15rem)}
.cta{margin-top:clamp(22px,3.6vh,40px);display:inline-flex;align-items:center;gap:14px;padding:8px;padding-inline-start:28px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:1.05rem;transition:background .25s,transform .25s}
.cta .dot{width:46px;height:46px;border-radius:50%;background:var(--copper);display:grid;place-items:center;transition:transform .3s}
.cta svg{width:20px;height:20px}
html[dir=rtl] .cta svg{transform:scaleX(-1)}
.cta:hover{background:var(--teal-d)}
.cta:hover .dot{transform:translateX(3px)}
html[dir=rtl] .cta:hover .dot{transform:translateX(-3px)}
.cta:active{transform:scale(.98)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(18px,3vh,32px)}
.chips button{display:inline-flex;align-items:center;gap:9px;padding:9px 16px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:.92rem;font-weight:500;color:var(--ink);transition:border-color .2s,transform .2s,background .2s}
.chips button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--copper);flex:none}
.chips button:hover{border-color:var(--teal);background:#F0F8F8;transform:translateY(-1px)}
html[lang=ur] .chips button{line-height:1.9;padding:5px 16px}
.hero-foot{display:flex;flex-wrap:wrap;gap:10px 36px;font-size:.86rem;color:var(--ink-2)}
.hero-foot div{display:flex;align-items:center;gap:10px}
.hero-foot svg{width:18px;height:18px;color:var(--teal);flex:none}
.hero-art{position:relative;margin-block:clamp(12px,2vw,28px);margin-inline:0 clamp(12px,2vw,28px);border-radius:clamp(24px,3vw,44px);overflow:hidden;background:hsl(190 25% 92%)}
.hero-art svg.s{position:absolute;inset:0;width:100%;height:100%}
.hero-art img.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-art .band{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.hero-tag{position:absolute;inset-inline-start:clamp(16px,2vw,28px);bottom:clamp(16px,2vw,28px);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:16px;padding:12px 18px;font-size:.84rem;color:var(--ink-2);line-height:1.45;max-width:250px}
html[lang=ur] .hero-tag{line-height:2}
.hero-tag b{display:block;color:var(--ink);font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1.1}

/* ---------- deck ---------- */
.bar,.foot{direction:ltr}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,3vw,40px)}
.home{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:.88rem;transition:border-color .2s,background .2s}
.home:hover{border-color:var(--teal);background:#F0F8F8}
.home svg{width:16px;height:16px}
html[lang=ur] .home{padding:3px 16px}
.count{font-family:'Bricolage Grotesque','Segoe UI',sans-serif;font-weight:600;font-size:1.05rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.count b{color:var(--ink);font-size:1.4rem}
.viewport{overflow:hidden;min-height:0;position:relative}
.track{display:flex;height:100%;direction:ltr;transition:transform .7s cubic-bezier(.76,0,.24,1)}
.slide{flex:0 0 100%;height:100%;direction:inherit;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:clamp(20px,3.4vw,56px);padding:4px clamp(16px,3vw,40px) 12px}
html[dir=rtl] .slide{direction:rtl}
.pic{position:relative;border-radius:clamp(22px,2.6vw,36px);overflow:hidden;min-height:0;background:hsl(190 25% 92%)}
.pic svg.ph{position:absolute;inset:0;width:100%;height:100%}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.06);transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
.slide.on .pic img{transform:scale(1)}
.pic .chip{position:absolute;inset-inline-start:18px;top:18px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-radius:999px;padding:7px 16px;font-size:.86rem;font-weight:600;color:var(--ink)}
html[lang=ur] .pic .chip{padding:2px 16px;line-height:2}
.pic .tn{position:absolute;inset-inline-start:18px;bottom:18px;max-width:58%;direction:ltr;background:rgba(15,42,54,.78);backdrop-filter:blur(8px);color:#fff;border-radius:12px;padding:8px 14px;font-size:.8rem;font-weight:500;line-height:1.3}
.pic .big{position:absolute;inset-inline-end:22px;bottom:6px;font-family:'Bricolage Grotesque','Segoe UI',sans-serif;font-weight:700;font-size:clamp(4rem,9vw,8rem);line-height:1;color:rgba(255,255,255,.85);letter-spacing:-.04em;text-shadow:0 2px 30px rgba(15,42,54,.25);pointer-events:none}
.info{min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:4px 8px 8px 0;scrollbar-width:thin}
html[dir=rtl] .info{padding:4px 0 8px 8px}
.code{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:.9rem;color:var(--teal)}
.code::before{content:"";width:26px;height:3px;border-radius:2px;background:var(--copper)}
.info h2{font-family:var(--display);font-weight:600;font-size:clamp(1.7rem,3.1vw,2.9rem);line-height:1.06;letter-spacing:-.03em;margin-top:12px;text-wrap:balance}
html[lang=ur] .info h2{line-height:1.65;font-size:clamp(1.45rem,2.5vw,2.3rem);margin-top:4px}
.sec{margin-top:clamp(12px,2.1vh,22px)}
.sec h3{font-weight:600;font-size:.92rem;color:var(--teal);margin-bottom:6px}
html[lang=ur] .sec h3{line-height:2}
.sec p{font-size:clamp(1rem,1.2vw,1.12rem);line-height:1.55;color:var(--ink-2);max-width:36em}
html[lang=ur] .sec p{line-height:2.1;font-size:clamp(.92rem,1.1vw,1.02rem)}
.wow{margin-top:clamp(12px,2.1vh,22px);background:var(--tint);border-radius:18px;border-inline-start:6px solid var(--copper);padding:16px 20px;font-family:var(--display);font-weight:600;font-size:clamp(1.08rem,1.6vw,1.5rem);line-height:1.3;letter-spacing:-.015em;color:var(--ink);text-wrap:balance}
html[lang=ur] .wow{line-height:1.95;font-size:clamp(1rem,1.45vw,1.3rem)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(14px,2vw,28px);margin-top:clamp(12px,2.1vh,22px)}
.caps{list-style:none;display:grid;gap:9px}
.caps li{display:flex;gap:10px;font-size:.96rem;line-height:1.4;color:var(--ink)}
html[lang=ur] .caps li{line-height:1.95;font-size:.9rem}
.caps svg{width:20px;height:20px;flex:none;margin-top:2px;color:var(--teal)}
html[lang=ur] .caps svg{margin-top:9px}
.bring{background:var(--paper);border:1px dashed #B9C9D0;border-radius:16px;padding:14px 16px}
.bring svg{width:26px;height:26px;color:var(--copper);margin-bottom:6px}
.bring p{font-size:.95rem;line-height:1.45;color:var(--ink)}
html[lang=ur] .bring p{line-height:2;font-size:.88rem}
details.tech{margin-top:clamp(10px,1.8vh,18px);font-size:.85rem;color:var(--ink-2);direction:inherit}
details.tech summary{cursor:pointer;font-weight:600;color:var(--ink-3);padding:6px 0;list-style:none;display:inline-flex;align-items:center;gap:8px}
details.tech summary::-webkit-details-marker{display:none}
details.tech summary::after{content:"+";font-size:1.1rem;line-height:1;color:var(--copper)}
details.tech[open] summary::after{content:"–"}
details.tech dl{direction:ltr;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-top:6px;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;font-family:'Figtree','Segoe UI',sans-serif;line-height:1.4}
details.tech dt{color:var(--ink-3)}
details.tech dd{color:var(--ink)}

.foot{display:flex;align-items:center;gap:clamp(10px,2vw,24px);padding:12px clamp(16px,3vw,40px) 18px}
.arrow{width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s,color .2s,opacity .2s}
.arrow:hover:not(:disabled){background:var(--ink);color:#fff;border-color:var(--ink)}
.arrow:disabled{opacity:.35;cursor:default}
.arrow svg{width:20px;height:20px}
.rail{flex:1;display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:8px}
.rail button{position:relative;text-align:start;padding:10px 4px 0;font-size:.8rem;font-weight:600;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s;unicode-bidi:plaintext}
html[lang=ur] .rail button{line-height:1.9;padding-top:6px;font-size:.78rem}
.rail button::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.rail button:hover,.rail button.on{color:var(--ink)}
.rail button.on::before{background:var(--copper)}
.rail button.seen::before{background:#9FBFC4}
.rail button.on.seen::before{background:var(--copper)}

/* ---------- periodic table button + pop-up ---------- */
.ptbtn{margin-top:clamp(12px,2vh,20px);display:flex;width:fit-content;max-width:100%;align-items:center;gap:12px;padding:8px 16px 8px 8px;border-radius:14px;background:var(--paper);border:1px solid var(--line);font-weight:600;font-size:.92rem;color:var(--ink);text-align:start;transition:border-color .2s,background .2s}
html[dir=rtl] .ptbtn{padding:8px 8px 8px 16px}
.ptbtn:hover{border-color:var(--teal);background:#F0F8F8}
.ptbtn .ic{width:36px;height:36px;border-radius:10px;background:var(--teal);display:grid;place-items:center;flex:none}
.ptbtn .ic svg{width:20px;height:20px}
.ptbtn .cnt{background:var(--tint);color:var(--teal-d);border-radius:999px;padding:2px 10px;font-size:.8rem;flex:none;font-family:'Bricolage Grotesque','Segoe UI',sans-serif}
html[lang=ur] .ptbtn{line-height:1.9;font-size:.85rem}

.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:clamp(10px,2.5vw,32px);background:rgba(15,42,54,.45);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.modal.show{opacity:1;visibility:visible}
.sheet{width:min(1180px,100%);max-height:100%;overflow:auto;background:var(--paper);border-radius:clamp(20px,2.4vw,32px);padding:clamp(16px,2.4vw,32px);box-shadow:0 30px 80px -20px rgba(15,42,54,.45);transform:translateY(24px) scale(.98);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.modal.show .sheet{transform:none}
.sheet header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:clamp(10px,1.8vh,18px)}
.sheet h2{font-family:var(--display);font-weight:600;font-size:clamp(1.3rem,2.4vw,2rem);line-height:1.15;letter-spacing:-.02em}
html[lang=ur] .sheet h2{line-height:1.7;font-size:clamp(1.15rem,2vw,1.7rem)}
.sheet header p{margin-top:4px;color:var(--ink-2);font-size:.95rem}
.x{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .2s,color .2s}
.x:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.x svg{width:18px;height:18px}
.ptwrap{overflow-x:auto;direction:ltr;padding-bottom:4px}
.pt{container-type:inline-size;display:grid;grid-template-columns:repeat(18,1fr);grid-template-rows:repeat(7,1fr) .3fr repeat(2,1fr);gap:3px;aspect-ratio:18/9.6;min-width:700px;width:min(100%,calc((100dvh - 260px) * 1.8));margin-inline:auto}
.cell{position:relative;border-radius:clamp(3px,.5cqw,8px);display:flex;flex-direction:column;align-items:center;justify-content:center;background:#EEF2F5;color:#A8B8C0;line-height:1;cursor:default;user-select:none;transition:background .35s var(--d,0ms),color .35s var(--d,0ms),transform .15s,box-shadow .15s}
.cell i{font-style:normal;font-size:max(7.5px,.85cqw);opacity:.8;margin-bottom:2px}
.cell b{font-family:'Bricolage Grotesque','Segoe UI',sans-serif;font-weight:600;font-size:max(12px,2.1cqw)}
.pt.lit .cell.on{background:var(--teal);color:#fff}
.cell.sel{transform:scale(1.14);z-index:2;box-shadow:0 8px 20px -6px rgba(15,42,54,.35);outline:2px solid var(--ink)}
.lbl{grid-column:3;display:grid;place-items:center;text-align:center;font-size:max(7px,.8cqw);color:var(--ink-3);font-family:'Figtree','Segoe UI',sans-serif}
.ptfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;margin-top:clamp(10px,1.8vh,16px)}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.9rem;color:var(--ink-2)}
.legend>span{display:inline-flex;align-items:center;gap:8px}
.sw{width:16px;height:16px;border-radius:5px;background:#EEF2F5;border:1px solid #D4DEE3}
.sw.on{background:var(--teal);border-color:var(--teal)}
.read{font-size:1rem;color:var(--ink-2);min-height:1.6em}
.read b{font-family:'Bricolage Grotesque','Segoe UI',sans-serif;font-size:1.3rem;color:var(--ink);margin-inline-end:6px}
.read .yes{color:var(--teal);font-weight:600;margin-inline-start:8px}
.read .no{color:var(--ink-3);margin-inline-start:8px}
html[lang=ur] .read,html[lang=ur] .legend{line-height:1.9}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- responsive ---------- */
@media (max-width:900px){
  #hero{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 24dvh}
  .hero-copy{padding-bottom:8px}
  .hero-art{margin:0 12px 12px}
  .hero-foot,.hero-tag{display:none}
  .slide{grid-template-columns:1fr;grid-template-rows:minmax(0,30dvh) minmax(0,1fr);gap:12px}
  .info{justify-content:flex-start;padding:0 !important}
  .pic .big{font-size:3.4rem}
  .two{grid-template-columns:1fr}
  .rail button{font-size:0 !important;padding-top:14px}
  .arrow{width:44px;height:44px}
}
@media (max-width:900px) and (max-height:760px){.chips{display:none}}
@media (min-width:901px) and (max-height:720px){.hero-foot{display:none}.chips{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- ================= HERO ================= -->
<section id="hero" class="view" aria-label="Welcome">
  <div class="hero-copy">
    <div class="top">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="4" rx="1.5" fill="#fff"/><rect x="3" y="10" width="18" height="4" rx="1.5" fill="#C77B3F"/><rect x="3" y="16" width="18" height="4" rx="1.5" fill="#fff" opacity=".6"/></svg>
        </div>
        <div><b>GARL</b><span data-i18n="brandSub"></span></div>
      </div>
      <button class="lang" type="button" data-lang-btn></button>
    </div>

    <div class="hero-main">
      <h1 data-i18n="title"></h1>
      <p class="lede" data-i18n="lede"></p>
      <button class="cta" id="explore" type="button">
        <span data-i18n="cta"></span>
        <span class="dot" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </button>
      <div class="chips" id="chips"></div>
    </div>

    <div class="hero-foot">
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg><span data-i18n="iso"></span></div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 005 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span data-i18n="gsp"></span></div>
    </div>
  </div>

  <div class="hero-art" aria-hidden="true">
    <img class="hero-img" src="images/garl.jpg" alt="" loading="eager">
    <div class="hero-tag" data-i18n="tag"></div>
  </div>
</section>

<!-- ================= DECK ================= -->
<section id="deck" class="view" aria-label="Laboratories">
  <div class="bar">
    <button class="home" id="home" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>
      <span data-i18n="home"></span>

/* ============ Strata artwork (hero + image fallback) ============ */
const NS = "http://www.w3.org/2000/svg";
function strata(svg, W, H, hue, animate){
  svg.innerHTML = "";
  const n = 9, veinIdx = 5;
  let veinD = "";
  for (let i = 0; i < n; i++){
    const base = H * (0.08 + i * (0.92 / n));
    const amp = 18 + (i % 3) * 14;
    const f = 1.2 + (i % 2) * 0.5;
    const ph = i * 0.9 + hue * 0.02;
    const tilt = (i % 2 ? -1 : 1) * H * 0.05;
    let d = "";
    for (let x = 0; x <= W; x += 20){
      const y = base + amp * Math.sin((x / W) * Math.PI * 2 * f + ph) + (x / W) * tilt;
      d += (x ? "L" : "M") + x + "," + y.toFixed(1);
    }
    if (i === veinIdx) veinD = d;
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d + `L${W},${H}L0,${H}Z`);
    p.setAttribute("fill", `hsl(${hue + i * 3} ${22 + i * 2}% ${91 - i * 4.6}%)`);
    p.setAttribute("stroke", "rgba(255,255,255,.55)");
    p.setAttribute("stroke-width", "1.5");
    if (animate){ p.setAttribute("class", "band"); p.style.animationDelay = (i * 0.09) + "s"; }
    svg.appendChild(p);
  }
  const vein = document.createElementNS(NS, "path");
  vein.setAttribute("d", veinD);
  vein.setAttribute("fill", "none");
  vein.setAttribute("stroke", "#C77B3F");
  vein.setAttribute("stroke-width", "5");
  vein.setAttribute("stroke-linecap", "round");
  if (animate){ vein.setAttribute("class", "band"); vein.style.animationDelay = (veinIdx * 0.09 + 0.15) + "s"; }
  svg.appendChild(vein);
}

function ptPos(z){
  if (z === 1) return [1, 1];
  if (z === 2) return [1, 18];
  if (z <= 4)  return [2, z - 2];
  if (z <= 10) return [2, z + 8];
  if (z <= 12) return [3, z - 10];
  if (z <= 18) return [3, z];
  if (z <= 36) return [4, z - 18];
  if (z <= 54) return [5, z - 36];
  if (z <= 56) return [6, z - 54];
  if (z <= 71) return [9, z - 54];
  if (z <= 86) return [6, z - 68];
  if (z <= 88) return [7, z - 86];
  if (z <= 103) return [10, z - 86];
  return [7, z - 100];
}

  const [r, c] = ptPos(z);

  d.className = "cell";
  d.style.gridRow = r; d.style.gridColumn = c;
  d.dataset.z = z;
  d.innerHTML = `<i>${z}</i><b>${SYM[z - 1]}</b>`;
  pt.appendChild(d);

}
[[6, "57–71"], [7, "89–103"]].forEach(([r, t]) => {

function showRead(z){

  cells.forEach(c => c.classList.toggle("sel", c === cells[z - 1]));
}
["mouseover", "click"].forEach(ev => pt.addEventListener(ev, e => {

let ptOpener = null;
function openPT(i, opener){
  const L = UI[lang], it = instruments[i], set = new Set(it.elements);
  ptOpener = opener;
  document.getElementById("ptTitle").textContent = L.elTitle;
  document.getElementById("ptSub").textContent = it.name;
  document.getElementById("legOn").textContent = `${L.legOn} (${it.elements.length})`;
  document.getElementById("legOff").textContent = L.legOff;
  ptClose.setAttribute("aria-label", L.close);
  readout.textContent = L.prompt;
  document.getElementById("ptList").textContent = it.elements.map(s => NAMES[SYM.indexOf(s)]).join(", ");
  pt.classList.remove("lit");
  let k = 0;
  cells.forEach((c, j) => {
    const on = set.has(SYM[j]);
    c.classList.toggle("on", on);
    c.classList.remove("sel");
    if (on) c.style.setProperty("--d", (k++ * 22) + "ms");
  });
  ptModal.classList.add("show");
  document.getElementById("deck").inert = true;
  requestAnimationFrame(() => requestAnimationFrame(() => pt.classList.add("lit")));
  ptClose.focus({preventScroll:true});
}
function closePT(){
  ptModal.classList.remove("show");
  document.getElementById("deck").inert = false;
  if (ptOpener) ptOpener.focus({preventScroll:true});
}
ptClose.addEventListener("click", closePT);

/* ============ Rendering ============ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderHero(){
  const L = UI[lang];

    document.getElementById("chips").appendChild(b);
  });

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ur" ? "rtl" : "ltr";
  document.title = UI[l].title;
  renderHero();
  renderDeck();
}

/* ============ Navigation ============ */
function go(n, quiet){
  idx = Math.max(0, Math.min(instruments.length - 1, n));
  seen.add(idx);
  const slides = [...track.children], tabs = [...rail.children];
  track.style.transform = `translateX(${-idx * 100}%)`;
  slides.forEach((s, i) => { s.classList.toggle("on", i === idx); s.inert = i !== idx; });
  tabs.forEach((t, i) => {
    t.classList.toggle("on", i === idx);
    t.classList.toggle("seen", seen.has(i));
    if (i === idx) t.setAttribute("aria-current", "true"); else t.removeAttribute("aria-current");
  });
  cur.textContent = idx + 1;
  prev.disabled = idx === 0;
  next.disabled = idx === instruments.length - 1;
}
function openDeck(n = 0){
  document.body.classList.add("open");
  document.getElementById("hero").inert = true;
  document.getElementById("deck").inert = false;
  go(n);
}
function closeDeck(){
  document.body.classList.remove("open");
  document.getElementById("hero").inert = false;
  document.getElementById("deck").inert = true;
  seen.clear();
}

document.getElementById("explore").addEventListener("click", () => openDeck(0));
document.getElementById("home").addEventListener("click", closeDeck);
document.querySelectorAll("[data-lang-btn]").forEach(b => b.addEventListener("click", () => setLang(lang === "en" ? "ur" : "en")));
track.addEventListener("click", e => {
  const b = e.target.closest("[data-pt]");
  if (b) openPT(+b.dataset.pt, b);
});
prev.addEventListener("click", () => go(idx - 1));
next.addEventListener("click", () => go(idx + 1));

window.addEventListener("keydown", e => {
  if (ptModal.classList.contains("show")){
    if (e.key === "Escape") closePT();
    else if (e.key === "Tab"){ e.preventDefault(); ptClose.focus(); }
    return;
  }
  const open = document.body.classList.contains("open");
  if (!open){ if (e.key === "Enter" && document.activeElement === document.body) openDeck(0); return; }
  if (e.key === "ArrowRight") go(idx + 1);
  else if (e.key === "ArrowLeft") go(idx - 1);
  else if (e.key === "Escape") closeDeck();
});

/* swipe */
let sx = null, sy = null;
const vp = document.querySelector(".viewport");
vp.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
vp.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) go(idx + (dx < 0 ? 1 : -1));
  sx = sy = null;
}, {passive:true});

document.getElementById("deck").inert = true;
setLang("en");
